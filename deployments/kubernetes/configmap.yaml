apiVersion: v1
kind: ConfigMap
metadata:
  name: user-service-config
data:
  SERVER_PORT: "50051"
  MONGO_DATABASE: "userdb"
  MONGO_MAX_POOL_SIZE: "100"
  MONGO_MIN_POOL_SIZE: "10"
  REDIS_POOL_SIZE: "100"
  REDIS_MIN_IDLE_CONNS: "10"
  REDIS_TTL: "1h"
  KAFKA_TOPIC: "user-events"
  KAFKA_BATCH_SIZE: "100"
  LOG_LEVEL: "info"
  METRICS_PORT: "9090"
  GRACEFUL_TIMEOUT: "30s"
