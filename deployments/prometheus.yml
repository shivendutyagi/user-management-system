global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'user-management-cluster'
    environment: 'development'

scrape_configs:
  - job_name: 'user-service'
    static_configs:
      - targets: ['user-service:9090']
        labels:
          service: 'user-service'
          component: 'grpc'
    
    metrics_path: '/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'

  - job_name: 'mongodb'
    static_configs:
      - targets: ['mongodb:27017']
        labels:
          service: 'mongodb'

  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']
        labels:
          service: 'redis'

alerting:
  alertmanagers:
    - static_configs:
        - targets: []