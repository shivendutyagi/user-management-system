services:
  # MongoDB
  mongodb:
    image: mongo:7.0
    container_name: user_mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: userdb
    volumes:
      - mongodb_data:/data/db
      - ./scripts/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js
    networks:
      - user_network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/userdb --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis
  redis:
    image: redis:7.2-alpine
    container_name: user_redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - user_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Zookeeper (required for Kafka)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: user_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - user_network
    healthcheck:
      test: nc -z localhost 2181 || exit -1
      interval: 10s
      timeout: 5s
      retries: 5

  # Kafka
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: user_kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9093,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - user_network
    healthcheck:
      test: kafka-broker-api-versions --bootstrap-server localhost:9092
      interval: 30s
      timeout: 10s
      retries: 5

  # User Service
  user-service:
    build:
      context: .
      dockerfile: Dockerfile.user-service
    container_name: user_service
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "50051:50051"
      - "9090:9090"
    environment:
      SERVER_PORT: 50051
      MONGO_URI: mongodb://admin:admin123@mongodb:27017
      MONGO_DATABASE: userdb
      REDIS_ADDR: redis:6379
      KAFKA_BROKERS: kafka:9093
      KAFKA_TOPIC: user-events
      LOG_LEVEL: info
      METRICS_PORT: 9090
    networks:
      - user_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=:50051"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Analytics Service
  analytics-service:
    build:
      context: .
      dockerfile: Dockerfile.analytics-service
    container_name: analytics_service
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      REDIS_ADDR: redis:6379
      KAFKA_BROKERS: kafka:9093
      KAFKA_TOPIC: user-events
      KAFKA_CONSUMER_GROUP: analytics-service
      LOG_LEVEL: info
    networks:
      - user_network
    restart: unless-stopped

  # Prometheus for metrics
  prometheus:
    image: prom/prometheus:latest
    container_name: user_prometheus
    ports:
      - "9091:9090"
    volumes:
      - ./deployments/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - user_network

  # Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    container_name: user_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deployments/grafana-dashboards:/etc/grafana/provisioning/dashboards
      - ./deployments/grafana-provisioning:/etc/grafana/provisioning/datasources
    networks:
      - user_network
    depends_on:
      - prometheus

  # # API Gateway (HTTP/REST to gRPC)
  # gateway:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile.gateway
  #   container_name: user_gateway
  #   depends_on:
  #     user-service:
  #       condition: service_healthy
  #   ports:
  #     - "8080:8080"
  #   environment:
  #     SERVER_PORT: 50051
  #   networks:
  #     - user_network
  #   restart: unless-stopped

networks:
  user_network:
    driver: bridge

volumes:
  mongodb_data:
  redis_data:
  kafka_data:
  prometheus_data:
  grafana_data: